<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #2f173d 0%, #3A2147 52%, #4e3162 100%);
            color: #ffffff;
        }

        .coming-soon-card {
            width: min(640px, 100%);
            text-align: center;
            padding: 42px 28px;
            border-radius: 20px;
            border: 1px solid rgba(193, 192, 216, 0.4);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 30px rgba(10, 4, 14, 0.35);
            backdrop-filter: blur(8px);
        }

        .coming-soon-card h1 {
            font-size: clamp(36px, 6vw, 56px);
            margin-bottom: 12px;
        }

        .coming-soon-card p {
            color: #e8ddf5;
            font-size: 18px;
            margin-bottom: 22px;
        }

        .back-home {
            display: inline-block;
            text-decoration: none;
            background: #C1C0D8;
            color: #3A2147;
            border: 2px solid #C1C0D8;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 700;
            transition: all 0.22s ease;
        }

        .back-home:hover {
            background: transparent;
            color: #C1C0D8;
        }
    </style>
</head>
<body>
    <main class="coming-soon-card">
        <h1>Coming Soon</h1>
        <p>More project case studies will be added here shortly.</p>
        <a href="index.html" class="back-home">Back to Home</a>
    </main>
</body>
</html>

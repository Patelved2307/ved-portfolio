<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Patel Ved</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--cream:#FAF7F2;--cream2:#F2EDE4;--warm:#EDE5D8;--violet:#3A2147;--violet2:#5C3370;--accent:#D4A853;--accent2:#E8C47A;--text:#1A1020;--text2:#4A3555;--text3:#7A6585;--white:#FFFFFF;--shadow:rgba(58,33,71,0.10);--shadow2:rgba(58,33,71,0.20);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow-x:hidden;width:100%;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);}
a{text-decoration:none;}
img{max-width:100%;display:block;}

.page-nav{position:sticky;top:0;z-index:100;background:rgba(250,247,242,0.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(58,33,71,0.09);display:flex;justify-content:space-between;align-items:center;padding:0 52px;height:66px;box-shadow:0 2px 16px var(--shadow);}
.nav-logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--violet);}
.nav-logo::after{content:'.';color:var(--accent);}
.nav-back{display:inline-flex;align-items:center;gap:8px;background:var(--violet);color:var(--white);border:2px solid var(--violet);border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;transition:all 0.25s;}
.nav-back:hover{background:var(--violet2);border-color:var(--violet2);}

/* HERO */
.pd-hero{position:relative;height:min(48vh,420px);min-height:280px;overflow:hidden;}
.pd-hero img{width:100%;height:100%;object-fit:cover;}
.pd-hero .hero-art{width:100%;height:100%;border-radius:0;border:none;margin:0;}
.pd-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(26,16,32,0.05) 0%, rgba(26,16,32,0.55) 75%, rgba(26,16,32,0.85) 100%);display:flex;align-items:flex-end;}
.pd-hero-inner{max-width:1000px;margin:0 auto;width:100%;padding:0 52px 40px;}
.pd-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.pd-tag{display:inline-block;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,0.14);border:1.5px solid rgba(255,255,255,0.35);color:var(--white);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;backdrop-filter:blur(6px);}
.pd-tag.gold{background:var(--accent);border-color:var(--accent);color:var(--violet);}
.pd-hero h1{font-family:'Playfair Display',serif;font-size:clamp(30px,5vw,52px);color:var(--white);font-weight:900;line-height:1.08;text-shadow:0 4px 20px rgba(0,0,0,0.3);}

/* BODY */
.pd-body{max-width:1000px;margin:0 auto;padding:56px 52px 90px;display:grid;grid-template-columns:1.65fr 1fr;gap:48px;}
.pd-main{min-width:0;}
.pd-summary{font-size:19px;line-height:1.75;color:var(--text2);margin-bottom:36px;padding-bottom:36px;border-bottom:1.5px solid var(--warm);font-family:'Playfair Display',serif;font-style:italic;}
.pd-section{margin-bottom:32px;opacity:0;transform:translateY(14px);animation:pdIn .6s cubic-bezier(.25,.46,.45,.94) forwards;}
.pd-section:nth-of-type(1){animation-delay:.05s}
.pd-section:nth-of-type(2){animation-delay:.12s}
.pd-section:nth-of-type(3){animation-delay:.19s}
@keyframes pdIn{to{opacity:1;transform:translateY(0);}}
.pd-section h3{font-family:'Playfair Display',serif;font-size:22px;color:var(--violet);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.pd-section h3 i{color:var(--accent);font-size:16px;}
.pd-section p{font-size:15.5px;line-height:1.85;color:var(--text2);}

.pd-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.pd-btn{display:inline-flex;align-items:center;gap:8px;background:var(--violet);color:var(--white);border:2px solid var(--violet);padding:12px 22px;border-radius:10px;font-size:14px;font-weight:700;transition:all .2s;}
.pd-btn:hover{background:var(--violet2);border-color:var(--violet2);transform:translateY(-2px);}
.pd-btn.gold{background:var(--accent);border-color:var(--accent);color:var(--violet);}
.pd-btn.gold:hover{background:var(--accent2);border-color:var(--accent2);}

/* SIDEBAR */
.pd-side{position:sticky;top:90px;align-self:start;}
.pd-card{background:var(--white);border-radius:18px;border:1.5px solid rgba(58,33,71,0.08);padding:24px;box-shadow:0 4px 20px var(--shadow);margin-bottom:20px;}
.pd-card h4{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:14px;}
.pd-meta-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--warm);font-size:14px;}
.pd-meta-row:last-child{border-bottom:none;}
.pd-meta-row span:first-child{color:var(--text3);}
.pd-meta-row span:last-child{color:var(--violet);font-weight:700;text-align:right;}

.pd-cta-card{background:linear-gradient(135deg,var(--violet) 0%,var(--violet2) 100%);border-radius:18px;padding:26px;text-align:center;}
.pd-cta-card p{color:rgba(255,255,255,0.7);font-size:13px;margin-bottom:16px;line-height:1.6;}
.pd-cta-card .pd-btn{width:100%;justify-content:center;}

/* RELATED */
.pd-related{background:var(--cream2);padding:56px 52px 70px;}
.pd-related-inner{max-width:1000px;margin:0 auto;}
.pd-related h3{font-family:'Playfair Display',serif;font-size:26px;color:var(--violet);margin-bottom:24px;}
.pd-related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.pd-related-card{background:var(--white);border-radius:16px;overflow:hidden;border:1.5px solid var(--warm);transition:all .25s;box-shadow:0 4px 16px var(--shadow);}
.pd-related-card:hover{transform:translateY(-5px);box-shadow:0 16px 32px var(--shadow2);}
.pd-related-img{height:120px;}
.pd-related-body{padding:16px;}
.pd-related-body span{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);}
.pd-related-body h4{font-family:'Playfair Display',serif;font-size:16px;color:var(--violet);margin-top:6px;line-height:1.25;}

.page-footer{background:var(--violet);padding:28px 52px;}
.footer-copy{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.footer-copy span{color:rgba(255,255,255,0.4);font-size:12px;}
.footer-copy a{color:rgba(255,255,255,0.55);font-size:13px;transition:color 0.2s;}
.footer-copy a:hover{color:var(--accent);}

/* Hero-art reused from projects-data helper */
.hero-art{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.hero-art-icon{font-size:88px;position:relative;z-index:2;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.25));}
.hero-art-shape{position:absolute;border-radius:50%;}
.hero-art-shape-1{width:220px;height:220px;top:-60px;right:-40px;}
.hero-art-shape-2{width:160px;height:160px;bottom:-50px;left:-30px;}
.hero-art-shape-3{width:120px;height:120px;top:30px;left:40px;border:2px solid;border-radius:50%;background:transparent!important;}
.pd-related-img.hero-art .hero-art-icon{font-size:36px;}
.pd-related-img.hero-art .hero-art-shape-1{width:100px;height:100px;}
.pd-related-img.hero-art .hero-art-shape-2{width:70px;height:70px;}
.pd-related-img.hero-art .hero-art-shape-3{width:50px;height:50px;}

.pd-empty{max-width:600px;margin:120px auto;text-align:center;padding:0 24px;}
.pd-empty h2{font-family:'Playfair Display',serif;font-size:32px;color:var(--violet);margin-bottom:14px;}
.pd-empty p{color:var(--text2);margin-bottom:24px;}

@media(max-width:900px){
    .page-nav,.pd-hero-inner,.pd-body,.pd-related{padding-left:24px;padding-right:24px;}
    .pd-body{grid-template-columns:1fr;}
    .pd-side{position:static;}
    .pd-related-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:600px){
    .page-nav{padding:0 16px;height:60px;}
    .pd-hero{height:280px;}
    .pd-hero-inner{padding:0 16px 28px;}
    .pd-body{padding:36px 16px 60px;gap:32px;}
    .pd-summary{font-size:16px;}
    .pd-related{padding:40px 16px 50px;}
    .pd-related-grid{grid-template-columns:1fr;}
    .page-footer{padding:20px 16px;}
    .footer-copy{flex-direction:column;text-align:center;}
}
</style>
</head>
<body>

<nav class="page-nav">
    <div class="nav-logo">Portfolio</div>
    <a href="all-projects.html" class="nav-back"><i class="fa-solid fa-arrow-left"></i> All Projects</a>
</nav>

<div id="pd-content"></div>

<footer class="page-footer">
    <div class="footer-copy">
        <span>© 2026 Patel Ved. All rights reserved.</span>
        <a href="index.html">← Back to Portfolio</a>
    </div>
</footer>

<script src="js/projects-data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const project = PROJECTS.find(p => p.id === id);
const content = document.getElementById('pd-content');

if (!project) {
    content.innerHTML = `
        <div class="pd-empty">
            <h2>Project not found</h2>
            <p>The project you're looking for may have moved. Browse the full list instead.</p>
            <a href="all-projects.html" class="pd-btn gold" style="display:inline-flex;">View All Projects</a>
        </div>
    `;
} else {
    document.title = project.title + " — Patel Ved";

    const heroMedia = project.image
        ? `<img src="${project.image}" alt="${project.title}">`
        : projectHeroArt(project, 'hero-art');

    content.innerHTML = `
        <section class="pd-hero">
            ${heroMedia}
            <div class="pd-hero-overlay">
                <div class="pd-hero-inner">
                    <div class="pd-tags">
                        <span class="pd-tag gold">${project.tag}</span>
                        <span class="pd-tag">${project.status}</span>
                    </div>
                    <h1>${project.title}</h1>
                </div>
            </div>
        </section>

        <div class="pd-body">
            <div class="pd-main">
                <p class="pd-summary">${project.overview}</p>

                <div class="pd-section">
                    <h3><i class="fa-solid fa-circle-question"></i> The Problem</h3>
                    <p>${project.problem}</p>
                </div>
                <div class="pd-section">
                    <h3><i class="fa-solid fa-drafting-compass"></i> My Approach</h3>
                    <p>${project.approach}</p>
                </div>
                <div class="pd-section">
                    <h3><i class="fa-solid fa-flag-checkered"></i> Outcome</h3>
                    <p>${project.outcome}</p>
                    <div class="pd-actions">
                        ${(project.actions || []).map(a => `<a href="${a.href}" class="pd-btn gold" ${a.href.startsWith('http') ? 'target="_blank"' : ''}><i class="${a.icon}"></i> ${a.label}</a>`).join('')}
                        <a href="all-projects.html" class="pd-btn"><i class="fa-solid fa-grip"></i> All Projects</a>
                    </div>
                </div>
            </div>

            <aside class="pd-side">
                <div class="pd-card">
                    <h4>Project Details</h4>
                    <div class="pd-meta-row"><span>Type</span><span>${project.type}</span></div>
                    <div class="pd-meta-row"><span>Role</span><span>${project.role}</span></div>
                    <div class="pd-meta-row"><span>Tools</span><span>${project.tools}</span></div>
                    <div class="pd-meta-row"><span>Status</span><span>${project.status}</span></div>
                </div>
                <div class="pd-cta-card">
                    <p>Want something like this built for you?</p>
                    <a href="hire-me.html" class="pd-btn gold"><i class="fa-solid fa-handshake"></i> Discuss a Project</a>
                </div>
            </aside>
        </div>
    `;

    // Related projects (same category, excluding current)
    const related = PROJECTS.filter(p => p.id !== project.id && p.category === project.category).slice(0, 3);
    const fallback = PROJECTS.filter(p => p.id !== project.id && p.category !== project.category).slice(0, 3 - related.length);
    const relatedList = related.concat(fallback);

    if (relatedList.length) {
        const relatedSection = document.createElement('section');
        relatedSection.className = 'pd-related';
        relatedSection.innerHTML = `
            <div class="pd-related-inner">
                <h3>More Projects</h3>
                <div class="pd-related-grid">
                    ${relatedList.map(p => `
                        <a href="project-detail.html?id=${p.id}" class="pd-related-card">
                            ${projectHeroArt(p, 'pd-related-img')}
                            <div class="pd-related-body">
                                <span>${p.status}</span>
                                <h4>${p.title}</h4>
                            </div>
                        </a>
                    `).join('')}
                </div>
            </div>
        `;
        content.after(relatedSection);
    }
}
</script>

</body>
</html>

<head>
    <meta charset="UTF-8">

    <title>About Me - Coming Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #2d173a 0%, #3A2147 52%, #4e3261 100%);
            color: #ffffff;
        }
        .card {
            width: min(640px, 100%);
            text-align: center;
            padding: 42px 28px;
            border-radius: 20px;
            border: 1px solid rgba(193, 192, 216, 0.4);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 30px rgba(10, 4, 14, 0.35);
            backdrop-filter: blur(8px);
        }
        h1 {
            font-size: clamp(34px, 6vw, 54px);
            margin-bottom: 10px;
        }
        p {
            color: #e8ddf5;
            font-size: 18px;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            text-decoration: none;
            background: #C1C0D8;
            color: #3A2147;
            border: 2px solid #C1C0D8;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 700;
            transition: all 0.22s ease;
        }
        a:hover {
            background: transparent;
            color: #C1C0D8;
        }
    </style>
</head>
